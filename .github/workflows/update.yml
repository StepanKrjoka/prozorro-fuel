name: Оновлення даних про закупівлі пального

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Що запустити: probe (діагностика), all (повний цикл), build (лише звіт)"
        default: "all"
        type: choice
        options: [all, probe, search, details, build]
      extra:
        description: "Додаткові параметри, напр. --full або --probe-from 2026-03-01"
        default: ""
        required: false
  schedule:
    - cron: "17 3 * * 1"   # щопонеділка о 03:17 UTC

permissions:
  contents: write

concurrency:
  group: fuel-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Запуск
        env:
          CMD: ${{ github.event.inputs.command || 'all' }}
          EXTRA: ${{ github.event.inputs.extra }}
        run: python fuel.py "$CMD" $EXTRA

      - name: Збереження результатів у репозиторій
        if: always() && (github.event.inputs.command || 'all') != 'probe'
        run: |
          git config user.name "fuel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Оновлення даних Prozorro $(date -u +%Y-%m-%d)"
            git push
          fi
